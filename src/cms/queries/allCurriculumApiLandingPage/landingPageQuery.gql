query {
  allCurriculumApiLandingPage(where: { _: { is_draft: false } }) {
    content {
      titleRaw
      bodyRaw
      image {
        altText
        asset {
          url
        }
      }
      cta {
        externalLink
        label
        variant
        icon
      }
    }

    usingTheApiSection {
      mainBlock {
        titleRaw
        cta {
          externalLink
          label
          variant
          icon
        }
        image {
          altText
          isPresentational
          asset {
            _id
            url
          }
        }
      }
      siblingBlocks {
        titleRaw
        cta {
          externalLink
          label
          variant
          icon
        }
        bodyRaw
      }
    }
  }
}
