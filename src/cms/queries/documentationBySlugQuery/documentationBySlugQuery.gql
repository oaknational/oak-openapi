query getDocsBySlug($navGroupSlug: String, $docSlug: String) {
  allCurriculumApiDocumentationPage(
    where: {
      navGroupType: { slug: { current: { eq: $navGroupSlug } } }
      slug: { current: { eq: $docSlug } }
    }
  ) {
    title
    slug {
      text: current
    }
    navGroupType {
      slug {
        text: current
      }
      name
    }
    contentRaw
  }
}
