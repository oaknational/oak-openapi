query getAllDocsNavGroups {
  groups: allNavGroup(where: { _: { is_draft: false } }) {
    title: name
    slug {
      text: current
    }
  }
  pages: allApiContentPage(where: { _: { is_draft: false } }) {
    title
    slug {
      text: current
    }
    parentGroup: navGroupType {
      slug {
        text: current
      }
    }
  }
}
