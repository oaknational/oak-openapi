version: 2
updates:
  # Application dependencies. Grouped so routine patch bumps arrive as one pull
  # request rather than a stream of them.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      production-minor-and-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Every action used in .github/workflows, not just Oak's own. Actions are
  # pinned to commit SHAs, and Dependabot updates the SHA and the version
  # comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(repo)"
    groups:
      actions:
        patterns: ["*"]

  # The base image in the Dockerfile, pinned by digest.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(infra)"

  # Terraform modules from oak-terraform-modules.
  - package-ecosystem: "terraform"
    directories: ["infrastructure/**/*"]
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(infra)"
