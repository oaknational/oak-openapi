name: Dependency Review

# Dependabot reports vulnerable dependencies after they are merged. This blocks
# them at review time, and flags licences that are not compatible with the
# repository's own MIT Licence.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to post the summary comment when a review fails.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Strong copyleft terms would create obligations Oak cannot meet in a
          # publicly released repository. Flag them for a human decision.
          # A scan on 20 August 2026 found none of these in the current tree.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          # Exception: sharp's platform-specific libvips binaries are
          # LGPL-3.0-or-later. LGPL permits dynamic linking without
          # relicensing, and they arrive transitively through Next.js image
          # optimisation. Allowed explicitly so a routine Next bump does not
          # fail the check, rather than dropping LGPL-3.0 from the deny list.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64
