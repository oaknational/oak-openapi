name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

# A release pushes back to main; never run two at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # semantic-release pushes the release commit to main, which is protected.
      # GITHUB_TOKEN cannot do that, so we mint a token for a GitHub App that is
      # on the branch-protection bypass list. See docs/RELEASING.md.
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          # semantic-release needs the full history and tags to work out what
          # has already been released.
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
