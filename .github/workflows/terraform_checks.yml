name: Terraform Checks

on:
  push:
    paths:
      - 'infrastructure/**'
      - '.tflint.hcl'
      - '.github/workflows/terraform_checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.tflint.hcl'
      - '.github/workflows/terraform_checks.yml'
  workflow_dispatch:

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform-lint-format:
    name: terraform-lint-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Terraform Action from oak-terraform-actions
        uses: oaknational/oak-terraform-actions/actions/terraform-checks@a1fe3aea1efa31ee5d29e387d584c006a2d33bcc # v1.13.1
