name: Run Linting Before Merge

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `lint`, not `test`: two workflows sharing a job name makes the
  # required-status-check entry in the branch ruleset ambiguous.
  lint:
    name: lint
    runs-on: ubuntu-latest

    env:
      OAK_GRAPHQL_SECRET: ${{ secrets.OAK_GRAPHQL_SECRET }}
      OAK_GRAPHQL_HOST: ${{ secrets.OAK_GRAPHQL_HOST }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      PRISMA_ACCELERATE_DATABASE_URL: ${{ secrets.PRISMA_ACCELERATE_DATABASE_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Fetch the pnpm binary directly instead of via `npm install`, which has
        # stalled for minutes on the npm registry/audit endpoint during setup.
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --ignore-scripts --frozen-lockfile
      # --ignore-scripts skips the postinstall that generates the Prisma client,
      # so the type-aware lint/tsc rules can't resolve @prisma/client. Generate
      # it explicitly here rather than dropping the supply-chain safety flag.
      - run: pnpm exec prisma generate --schema ./schema.prisma
      - name: Lint and type-check
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check

      # Documentation that drifts from the code is the fastest way for a public
      # repo's setup instructions to become wrong.
      - name: Check .env.example matches what the code reads
        run: pnpm check:env-example
