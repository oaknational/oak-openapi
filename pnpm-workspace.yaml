allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js: true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - decompress@4.2.2
  - '@posthog/core@1.48.6'
  - posthog-js@1.418.5
overrides:
  conventional-changelog-conventionalcommits@<9.3.1: 9.3.1
